<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hebbian V2</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/sat/0.9.0/SAT.min.js"
      integrity="sha512-I/Whsg25W/NpxpNL5dXAySa7JMz/r0ibfrqaTUTT97m2ggJAYbiioXaqL5hfoXmZ1CsvXaPyLKrwe3sSem20/A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
      integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <link rel="stylesheet" href="styles/utils.css" />
    <link rel="stylesheet" href="themes/default.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <script defer src="setup/augmentSAT.js" type="module"></script>
    <script defer src="setup/index.js" type="module"></script>
  </head>

  <body>
    <div class="MainContainer">
      <div class="Panel Panel1">
        <h1 class="PanelTitle height-item-1">Controls</h1>
        <div class="ControlPanelContainer height-item-2">
          <div class="ControlledBy">
            <div class="ControlledByCaption">Controlled By:</div>
            <div class="ControlledByOptions">
              <div class="ControlledByOption">
                <label>
                  <input
                    id="controlledByAI"
                    value="AI"
                    type="radio"
                    id="controlledByAI"
                    name="controlledBy"
                    checked
                  />
                  AI</label
                >
              </div>
              <div class="ControlledByOption">
                <label>
                  <input
                    id="controlledByHuman"
                    value="Human"
                    type="radio"
                    id="controlledByHuman"
                    name="controlledBy"
                  />
                  Human</label
                >
              </div>
            </div>
          </div>
          <div class="SimulationStartStopPauseResume">
            <button
              id="startStopSimulation"
              type="button"
              class="ControlPanelButton theme-success"
            >
              Start
            </button>
            <button
              id="pauseResumeSimulation"
              type="button"
              class="ControlPanelButton"
              disabled
            ></button>
          </div>
        </div>
        <h1 class="PanelTitle height-item-3">Parameters</h1>
        <div
          class="TabView Panel1TabView"
          id="parameterTabContainer"
          data-init-display="grid"
        >
          <div class="tab-title-container height-item-4">
            <div class="tab tab-active" id="gameTab">Game</div>
            <div class="tab" id="networkTab">Network</div>
            <div class="tab" id="learningTab">Learning</div>
          </div>

          <div class="tab-content-container">
            <div
              class="tab-content ParameterList display-flex"
              style="display: flex"
              id="gameParameters"
              data-init-display="flex"
            >
            <div class="ParameterControlGroup">
              <div class="ParameterControl">
                <label>Playfield Width (m)</label>
                <input type="number" id="playfieldWidth" />
              </div>
              <div class="ParameterControl">
                <label>Playfield Height (m)</label>
                <input type="number" id="playfieldHeight" />
              </div>
            </div>
            <div class="ParameterControlGroup">
              <div class="ParameterControl">
                <label>Icicle Width (m)</label>
                <input type="number" id="icicleWidth" />
              </div>
              <div class="ParameterControl">
                <label>Icicle Height (m)</label>
                <input type="number" id="icicleHeight" />
              </div>
            </div>


              <div class="ParameterControl">
                <label>Icicle Average Spawn Rate (icicles/s)</label>
                <input type="number" id="icicleAverageSpawnRate" />
              </div>
              <div class="ParameterControl">
                <label>Player Radius (m)</label>
                <input type="number" id="playerRadius" />
              </div>
              <div class="ParameterControl">
                <label>Player Movement Speed (m/s)</label>
                <input type="number" id="playerMovementSpeed" />
              </div>
            </div>
            <div
              class="tab-content ParameterList display-none"
              style="display: none"
              id="networkStructureParameters"
              data-init-display="flex"
            >
            <div class="ParameterControlGroup">
              <div class="ParameterControl">
                <label>Num Sensor Rays</label>
                <input type="number" id="numSensorRays" />
              </div>
              <div class="ParameterControl">
                <label>Sensor FOV (degrees)</label>
                <input type="number" id="sensorFOV" />
              </div>
            </div>

              <div class="ParameterControl">
                <label>Sensor Max Distance (m)</label>
                <input type="number" id="sensorMaxDistance" />
              </div>
              <div class="ParameterControl">
                <label>Num Motor Nodes</label>
                <input type="number" id="numMotorNodes" />
              </div>
              <div class="ParameterControlGroup">


                <div class="ParameterControl">
                  <label
                    >Target Data Node Count</label
                  >
                  <input type="number" id="targetDataNodeCount" />
                </div>
                <div class="ParameterControl">
                  <label
                    >Sigma</label
                  >
                  <input type="number" id="targetDataNodeCountSigma" />
                </div>

              </div>

              <div class="ParameterControlGroup">
                <div class="ParameterControl">
                  <label>Target Edge Count</label>
                  <input type="number" id="targetEdgeCount" />
                </div>
                <div class="ParameterControl">
                  <label>Sigma</label>
                  <input type="number" id="targetEdgeCountSigma" />
                </div>
              </div>

   
              <div class="ParameterControl">
                <label>Max Absolute Node Value</label>
                <input type="number" id="maxAbsoluteNodeValue" />
              </div>
              <div class="ParameterControl">
                <label>Max Absolute Edge Strength</label>
                <input type="number" id="maxAbsoluteEdgeStrength" />
              </div>
            </div>
            <div
              class="tab-content ParameterList display-none"
              style="display: none"
              id="learningParameters"
              data-init-display="flex"
            >
              <div class="ParameterControl">
                <label
                  >Firing Threshold
                  <span class="katex">I_{f}</span> (value/s)</label
                >
                <input type="number" id="firingThreshold" />
              </div>
              <div class="ParameterControl">
                <label
                  >Spike Activation Level
                  <span class="katex">I_{s}</span> (value/s)</label
                >
                <input type="number" id="spikeActivationLevel" />
              </div>
              <div class="ParameterControl">
                <label> Visual Activation Level <span class="katex">I_{v}</span> (value/s)</label>
                <input type="number" id="visualActivationLevel" />
              </div>
              <div class="ParameterControl">
                <label
                  >Spike Decay Time Constant
                  <span class="katex">\tau_{s}</span> (s)</label
                >
                <input type="number" id="spikeDecayTimeConstant" />
              </div>
              <div class="ParameterControl">
                <label
                  >Discharge Rate (value/s^2)
                >
                <input type="number" id="dischargeRate" />
              </div>
              <div class="ParameterControl">
                <label
                  >Leak Rate (value/s^2)
                <input type="number" id="leakRate" />
              </div>
              <div class="ParameterControl">
                <label
                  >Motor Leak Rate (value/s^2)
                <input type="number" id="motorLeakRate" />
              </div>
              <div class="ParameterControl">
                <label
                  >Spike Refractory Period
                  <span class="katex">T_{s}</span> (s)</label
                >
                <input type="number" id="spikeRefractoryPeriod" />
              </div>
              <div class="ParameterControl">
                <label
                  >Survival Time Reward
                  <span class="katex">R_{survive}</span> (fitness/s)</label
                >
                <input type="number" id="survivalReward" />
              </div>
              <div class="ParameterControl">
                <label
                  >Speed Reward
                  <span class="katex">R_{speed}</span> (fitness*m/(s^2))</label
                >
                <input type="number" id="speedReward" />
              </div>
              <div class="ParameterControl">
                <label
                  >Successful Dodge Reward
                  <span class="katex">R_{dodge}</span>fitness/dodge</label
                >
                <input type="number" id="successfulDodgeReward" />
              </div>
              <div class="ParameterControl">
                <label
                  >Death Punishment
                  <span class="katex">P_{death}</span>fitness/death</label
                >
                <input type="number" id="deathPunishment" />
              </div>
              <div class="ParameterControl">
                <label
                  >Threat Bonus Proximity
                  <span class="katex">d_{bonus}</span> (proportion)</label
                >
                <input type="number" id="threatBonusProximity" />
              </div>
              <div class="ParameterControl">
                <label
                  >Hebbian Reinforcement Time Constant
                  <span class="katex">\tau_h</span>
                  <span>(1/s)</span></label
                >
                <input type="number" id="hebbianReinforcementTimeConstant" />
              </div>
              <div class="ParameterControl">
                <label
                  >Edge Strength Leak Factor
                  <span>(strength/s)</span></label
                >
                <input type="number" id="edgeStrengthLeakFactor" />
              </div>
              <div class="ParameterControl">
                <label
                  >Hebbian Strength Factor
                  <span class="katex">\alpha_h</span>
                  <span>(strength/fitness)</span></label
                >
                <input type="number" id="hebbianStrengthFactor" />
              </div>
              <div class="ParameterControl">
                <label>Node Inactive Lifetime (s)</label>
                <input type="number" id="nodeInactiveLifetime" />
              </div>
              <div class="ParameterControl">
                <label>Edge Inactive Lifetime (s)</label>
                <input type="number" id="edgeInactiveLifetime" />
              </div>
              <div class="ParameterControl">
                <label
                  >Node Spawn Rate
                  <span class="katex">r_{s_{n}}</span>
                  (nodes/s)</label
                >
                <input type="number" id="nodeSpawnRate" />
              </div>
              <div class="ParameterControl">
                <label
                  >Edge Spawn Rate
                  <span class="katex">r_{s_{e}}</span>
                  (edges/s)</label
                >

                <input type="number" id="edgeSpawnRate" />
              </div>
              <div class="ParameterControl">
                <label
                  >Edge Excitatory/Inhibitory Spawn Ratio
                  <span class="katex">r_{ei}</span>
                  (proportion)</label
                >
                <input type="number" id="edgeExcToInhSpawnRatio" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="Panel Panel2">
        <h1 class="PanelTitle">Visualization</h1>
        <div class="VisCanvasContainer">
          <canvas
            class="VisCanvas"
            width="0"
            height="0"
            style="display: none; width: 0%; height: 0%"
          ></canvas>
        </div>
      </div>

      <div class="Panel Panel3">
        <h1 class="PanelTitle">Game</h1>
        <div class="GameCanvasContainer">
          <canvas
            class="GameCanvas"
            width="0"
            height="0"
            style="display: none; width: 100%; height: 100%"
          ></canvas>
        </div>
      </div>

      <div class="Panel Panel5">
        <h1 class="PanelTitle">Monitor &amp; Metrics</h1>
        <div class="MonitorAndMetricsContainer">
          <table class="MetricsTable">
            <thead class="MetricsTableHead">
              <tr>
                <th>Metric / State</th>
                <th>Value</th>
              </tr>
            </thead>
            <tbody class="MetricsTableBody">
              <tr>
                <td>Simulation State</td>
                <td id="simulationState">Stopped</td>
              </tr>
              <tr>
                <td>Threat Ray Count</td>
                <td id="threatRayCount">...</td>
              </tr>
              <tr>
                <td>Data Node Count</td>
                <td id="dataNodeCount">...</td>
              </tr>
              <tr>
                <td>Edge Count</td>
                <td id="edgeCount">...</td>
              </tr>
              <tr>
                <td>Speed</td>
                <td id="lastSpeed">...</td>
              </tr>
            </tbody>
          </table>
          <div class="FitnessPlotContainer">
            <div class="FitnessPlotBoundsContainer">
              <div
                class="FitnessPlotBound FitnessPlotPerSimBound High"
                id="simMax"
              >
                0.000
              </div>
              <div
                class="FitnessPlotBound FitnessPlotPerPlotBound High"
                id="plotMax"
              >
                0.000
              </div>
              <div
                class="FitnessPlotBound FitnessPlotPerPlotBound margin-top-auto Low"
                id="plotMin"
              >
                0.000
              </div>
              <div
                class="FitnessPlotBound FitnessPlotPerSimBound Low"
                id="simMin"
              >
                0.000
              </div>
            </div>
            <div class="FitnessCanvasAndSpacersContainer">
              <div class="FitnessPlotBound visibility-hidden">0.000</div>
              <div class="FitnessCanvasContainer">
                <canvas
                  class="FitnessCanvas"
                  width="0"
                  height="0"
                  style="display: none; width: 100%; height: 100%"
                ></canvas>
              </div>
              <div class="FitnessPlotBound visibility-hidden">0.000</div>
            </div>
          </div>
        </div>
      </div>
      <div class="Panel Panel6">
        <h1 class="PanelTitle">Debug Console</h1>
        <div class="DebugConsole"></div>
      </div>
    </div>
    <div class="PageLoadingOverlay" style="display: flex">
      <div class="PageLoadingSpinnerBox">
        <div class="PageLoadingSpinner"></div>
      </div>
    </div>
  </body>
</html>
